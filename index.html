<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101111">
<title>Veyra — Travel App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{
  --bg:#101111;--surface:#171918;--surface2:#1d201f;--surface3:#242725;
  --border:rgba(255,255,255,.09);--text:#f3f1e9;--muted:#a6aaa4;--faint:#6f746f;
  --accent:#d8bd82;--accent2:#efe0b4;--danger:#e88989;--shadow:0 18px 50px rgba(0,0,0,.3);
  --radius:20px;--ease:cubic-bezier(.2,.8,.2,1);--nav:76px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0d0e0e;color:var(--text);font-family:"DM Sans",sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;background:var(--bg)}
.shell{width:100%;max-width:1560px;margin:auto;min-height:100vh;display:flex}
.sidebar{display:none}
.main{width:100%;min-width:0}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20;background:rgba(16,17,17,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.brand{font:800 22px Manrope;letter-spacing:-.05em}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#d8dad4;font-size:20px;transition:.2s var(--ease)}
.icon-btn:hover,.icon-btn:active{background:var(--surface3);transform:scale(.97)}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.12)}
.content{padding:24px 18px calc(100px + env(safe-area-inset-bottom));max-width:1160px;margin:auto}
.screen{animation:screenIn .32s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2,h3{font-family:Manrope;margin:0;letter-spacing:-.045em}
h1{font-size:34px;line-height:1.04;margin-top:7px}
h2{font-size:22px}
h3{font-size:16px}
.sub{color:var(--muted);font-size:14px;line-height:1.55}
.section{margin-top:30px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.section-head button{color:var(--accent);font-size:13px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:0 14px;height:48px;margin-top:20px}
.search i{color:var(--faint)}
.search input{width:100%;border:0;outline:0;background:none;color:var(--text);font-size:14px}
.search input::placeholder{color:#737873}
.hero-feature{position:relative;height:410px;border-radius:26px;overflow:hidden;margin-top:22px;background:#222}
.hero-feature img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.hero-feature:hover img{transform:scale(1.025)}
.hero-feature:after,.destination-hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.hero-copy{position:absolute;z-index:2;left:20px;right:20px;bottom:22px}
.hero-copy h2{font-size:30px;margin:5px 0}
.hero-copy p{max-width:480px;color:#d8d8d2;margin:0;font-size:14px;line-height:1.5}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--border);background:var(--surface);border-radius:999px;font-size:12px;color:#c8cbc4}
.chip.active{background:var(--accent);color:#161616;border-color:var(--accent)}
.rail{display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.dest-card{min-width:205px;scroll-snap-align:start}
.dest-img{height:245px;border-radius:18px;overflow:hidden;background:#222;position:relative}
.dest-img img{width:100%;height:100%;object-fit:cover}
.save-float{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(15,16,16,.72);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:17px}
.save-float.saved{color:var(--accent)}
.meta{margin-top:9px}
.meta .place{font-size:12px;color:var(--muted)}
.meta strong{display:block;font:700 16px Manrope;margin-top:2px}
.meta .tiny{font-size:11px;color:var(--faint);margin-top:4px}
.friend-rail .friend{min-width:118px}
.friend-img{width:78px;height:78px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.friend strong{font-size:13px;display:block}
.friend span{font-size:11px;color:var(--muted)}
.activity-list{border-top:1px solid var(--border)}
.activity{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.activity img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.activity p{margin:0;color:#d1d3cd;font-size:13px;line-height:1.45}
.activity time{display:block;color:var(--faint);font-size:11px;margin-top:4px}
.post{border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:24px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.post-head img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.post-head strong{font-size:13px}.post-head span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.post-menu{margin-left:auto}
.post-media{border-radius:21px;overflow:hidden;background:#222;position:relative}
.post-media img{width:100%;aspect-ratio:4/4.4;object-fit:cover}
.post-caption{font-size:14px;line-height:1.55;color:#d8dad4;margin:11px 2px}
.post-actions{display:flex;align-items:center;gap:4px}
.post-actions button{padding:7px 8px;color:#c4c7c0;font-size:19px}
.post-actions button.active{color:var(--accent)}
.post-actions .count{font-size:12px;color:var(--muted);margin-right:7px;margin-left:-3px}
.page-title{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.explore-card{position:relative;height:255px;border-radius:19px;overflow:hidden}
.explore-card img{width:100%;height:100%;object-fit:cover}
.explore-card:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.explore-card .label{position:absolute;z-index:1;left:13px;right:13px;bottom:13px}
.label small{color:#d1d1cc;font-size:11px}.label strong{display:block;font:700 16px Manrope;margin-top:2px}
.destination-hero{height:430px;border-radius:25px;overflow:hidden;position:relative}
.destination-hero img{width:100%;height:100%;object-fit:cover}
.dest-detail-copy{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.dest-detail-copy h1{font-size:38px}
.action-row{display:flex;gap:9px;margin-top:15px}
.primary,.secondary{min-height:45px;border-radius:13px;padding:0 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary{background:var(--accent);color:#151515}.secondary{background:rgba(255,255,255,.09);border:1px solid var(--border)}
.info-list{display:grid;gap:0;border-top:1px solid var(--border)}
.info-row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row span{color:var(--muted)}
.place-row{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.place-row img{width:90px;height:76px;object-fit:cover;border-radius:13px}
.place-row strong{font-size:14px}.place-row p{font-size:12px;color:var(--muted);line-height:1.4;margin:5px 0}
.country-row{border:1px solid var(--border);background:var(--surface);border-radius:17px;overflow:hidden;margin-bottom:10px}
.country-head{padding:14px;display:flex;align-items:center;gap:12px}
.country-head img{width:64px;height:55px;border-radius:12px;object-fit:cover}
.country-head .grow{flex:1}.country-head strong{font:700 15px Manrope}.country-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.country-body{padding:0 14px 14px;display:grid;gap:8px}
.bucket-dest{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface2);border-radius:13px}
.bucket-dest img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.bucket-dest .grow{flex:1}.bucket-dest strong{font-size:13px}.bucket-dest small{color:var(--muted);font-size:11px}
.status{font-size:10px;padding:5px 7px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
.profile-cover{height:155px;border-radius:24px;overflow:hidden;position:relative;margin-bottom:-35px}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-header{padding:0 17px 0;position:relative}
.profile-avatar{width:78px;height:78px;border-radius:50%;border:4px solid var(--bg);object-fit:cover}
.profile-header h1{font-size:26px;margin-top:8px}.username{color:var(--accent);font-size:13px;margin-top:2px}
.stats{display:flex;gap:22px;margin:16px 0}.stat strong{font:700 17px Manrope;display:block}.stat span{font-size:10px;color:var(--muted)}
.profile-tabs{display:flex;border-bottom:1px solid var(--border);margin:22px -18px 18px;padding:0 18px;gap:22px}
.profile-tabs button{padding:12px 0;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}.profile-tabs button.active{color:var(--text);border-color:var(--accent)}
.settings-group{margin-top:24px}.settings-group h3{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.setting{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--border)}
.setting i{font-size:18px;width:25px;color:#c7c9c2}.setting .grow{flex:1}.setting strong{font-size:13px}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.switch{width:43px;height:25px;border-radius:20px;background:#343735;padding:3px}.switch:after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#aeb2ab;transition:.2s}.switch.on{background:var(--accent)}.switch.on:after{background:#151515;transform:translateX(18px)}
.search-results{display:grid;gap:5px;margin-top:12px}
.result{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.result img{width:50px;height:50px;border-radius:12px;object-fit:cover}.result .grow{flex:1}.result strong{font-size:13px}.result small{color:var(--muted);display:block;margin-top:3px;font-size:11px}
.notification{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--border)}
.notification img{width:38px;height:38px;border-radius:50%;object-fit:cover}.notification p{font-size:13px;line-height:1.4;margin:0}.notification time{font-size:10px;color:var(--faint)}
.next-stop{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:13px}
.next-stop img{width:92px;height:92px;object-fit:cover;border-radius:14px}.next-stop .grow{flex:1}
.route{display:flex;gap:0;overflow:auto;padding:8px 0}.route-item{min-width:105px;position:relative;padding-right:25px}.route-item:after{content:"";position:absolute;right:8px;top:8px;width:17px;border-top:1px solid var(--accent)}.route-item:last-child:after{display:none}.route-item span{font-size:10px;color:var(--muted)}.route-item strong{display:block;margin-top:4px;font-size:12px}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:7px 8px env(safe-area-inset-bottom);background:rgba(18,19,19,.9);backdrop-filter:blur(22px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7e837e;font-size:10px;position:relative}.nav-item i{font-size:19px}.nav-item.active{color:var(--text)}.nav-item.active:before{content:"";position:absolute;top:1px;width:22px;height:2px;border-radius:4px;background:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;opacity:0;pointer-events:none;transition:.25s}.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;left:0;right:0;bottom:0;max-height:92vh;background:#1a1c1b;border:1px solid var(--border);border-radius:25px 25px 0 0;transform:translateY(105%);transition:.35s var(--ease);padding:10px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -25px 70px rgba(0,0,0,.45)}
.sheet.show{transform:none}.grab{width:38px;height:4px;border-radius:5px;background:#555b56;margin:2px auto 18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.field{margin:12px 0}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#111312;border:1px solid var(--border);border-radius:12px;color:var(--text);outline:0;padding:12px}.field textarea{min-height:100px;resize:vertical}
.modal{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}.modal.show{opacity:1;pointer-events:auto}.modal-box{width:min(520px,100%);max-height:88vh;overflow:auto;background:#1a1c1b;border:1px solid var(--border);border-radius:23px;padding:20px;transform:translateY(12px) scale(.98);transition:.25s var(--ease)}.modal.show .modal-box{transform:none}
.toast{position:fixed;z-index:120;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#f0eee5;color:#171817;padding:11px 15px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);transition:.28s var(--ease);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:35px 10px;text-align:center;color:var(--muted)}.empty i{font-size:25px;display:block;margin-bottom:10px;color:var(--faint)}
.mapfake{height:180px;border-radius:20px;border:1px solid var(--border);overflow:hidden;position:relative;background:radial-gradient(circle at 30% 35%,#343a35 0 2px,transparent 3px),radial-gradient(circle at 70% 62%,#343a35 0 2px,transparent 3px),linear-gradient(125deg,#171a18,#232823)}
.mapfake:before{content:"";position:absolute;inset:25px 35px;border:1px dashed #687067;transform:rotate(-9deg);border-radius:40% 60% 50% 30%}
.map-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(216,189,130,.14)}
.dot1{left:25%;top:38%}.dot2{left:52%;top:52%}.dot3{left:73%;top:31%}
.skeleton{background:linear-gradient(90deg,#1a1c1b,#242725,#1a1c1b);background-size:200% 100%;animation:sk 1.2s infinite}.skeleton-img{height:200px;border-radius:18px}@keyframes sk{to{background-position:-200% 0}}
.desktop-only{display:none}
@media(min-width:700px){
  .content{padding:34px 28px 50px}.bottom-nav{display:none}.topbar{display:none}
  .sidebar{display:flex;flex-direction:column;width:230px;flex:0 0 230px;padding:28px 16px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
  .sidebar .brand{padding:0 12px 32px}.side-nav{display:grid;gap:4px}.side-nav button{height:44px;border-radius:11px;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--muted);font-size:13px;text-align:left}.side-nav button i{font-size:17px}.side-nav button.active{background:var(--surface);color:var(--text)}
  .side-user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--border);font-size:12px}.side-user img{width:34px;height:34px;border-radius:50%;object-fit:cover}.side-user span{color:var(--muted);display:block;font-size:10px}
  .desktop-only{display:block}.content{max-width:1120px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:28px}.hero-feature{height:440px}.grid{grid-template-columns:repeat(3,1fr)}
  .dest-card{min-width:230px}.dest-img{height:280px}.post{max-width:720px;margin-left:auto;margin-right:auto}
}
@media(min-width:1100px){
  .sidebar{width:245px;flex-basis:245px}.content{padding-left:42px;padding-right:42px}
  .grid{grid-template-columns:repeat(4,1fr)}.explore-card{height:280px}
}
@media(max-width:360px){.content{padding-left:14px;padding-right:14px}.hero-feature{height:370px}h1{font-size:30px}.dest-card{min-width:185px}.dest-img{height:220px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>

 if(!items.length)return "";
 const cover=dest(items[0].destination);
 return `<div class="country-row"><button class="country-head" style="width:100%;text-align:left" onclick="toggleCountry('${escapeHtml(c)}')"><img src="${cover.image}" alt=""><div class="grow"><strong>${escapeHtml(c)}</strong><small>${items.length} destination${items.length!==1?'s':''} saved</small></div><i class="bi bi-chevron-${state.openCountry===c?'up':'down'}"></i></button>${state.openCountry===c?`<div class="country-body">${items.map(bucketDest).join("")}</div>`:""}</div>`
}
function bucketDest(b){
 const d=dest(b.destination);
 return `<button class="bucket-dest" onclick="openBucketDestination('${escapeHtml(b.destination)}')"><img src="${d.image}" alt=""><div class="grow"><strong>${escapeHtml(b.destination)}</strong><small>${escapeHtml(b.notes||"No personal note yet.")}</small></div><span class="status">${escapeHtml(b.status)}</span></button>`
}
function bucketDestination(){
 const b=state.bucketList.find(x=>x.destination===state.selectedDestination?.name)||state.bucketList.find(x=>x.destination===state.selectedDestination?.name);
 const d=state.selectedDestination||dest("Granada");
 if(!b)return destinationScreen();
 return `<div class="screen"><div class="page-title"><button class="back" onclick="back()"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">${escapeHtml(b.country)}</div><span class="sub">Bucket List detail</span></div></div>
 <div class="destination-hero" style="margin-top:15px;height:390px"><img src="${d.image}" alt="${d.name}"><div class="dest-detail-copy"><div class="eyebrow">${escapeHtml(b.status)}</div><h1>${escapeHtml(d.name)}</h1><p class="sub" style="color:#ddd">Saved ${b.priority.toLowerCase()} priority · Your personal travel plan.</p></div></div>
 <section class="section"><div class="section-head"><h2>Trip details</h2></div><div class="info-list"><div class="info-row"><span>Saved</span><b>Aug 08, 2026</b></div><div class="info-row"><span>Priority</span><b>${b.priority}</b></div><div class="info-row"><span>Status</span><b>${b.status}</b></div><div class="info-row"><span>Estimated duration</span><b>4–6 days</b></div></div></section>
 <section class="section"><div class="section-head"><h2>Personal notes</h2><button onclick="openSheet('editBucket')">Edit</button></div><p class="sub">${escapeHtml(b.notes)}</p></section>
 <section class="section"><div class="section-head"><h2>Progress</h2><span class="eyebrow">${b.status==="Visited"?"100":"28"}%</span></div><div style="height:5px;background:#292c29;border-radius:9px;overflow:hidden"><div style="height:100%;width:${b.status==="Visited"?"100":"28"}%;background:var(--accent)"></div></div></section>
 <section class="section"><div class="action-row"><button class="primary" onclick="cycleStatus('${escapeHtml(d.name)}')"><i class="bi bi-check2"></i>Change status</button><button class="secondary" onclick="openSheet('plan')"><i class="bi bi-calendar3"></i>Plan trip</button><button class="secondary" onclick="removeBucket('${escapeHtml(d.name)}')"><i class="bi bi-trash3"></i>Remove</button></div></section>
 </div>`
}
function friends(){
 return `<div class="screen"><div class="eyebrow">Your people</div><h1>Friends</h1><div class="search" onclick="navigate('search')"><i class="bi bi-search"></i><input placeholder="Find travelers" readonly></div>
 <section class="section"><div class="section-head"><h2>Friends Are Traveling</h2></div><div class="grid">${state.friends.map(id=>friendCard(user(id))).join("")}</div></section>
 <section class="section"><div class="section-head"><h2>Suggested</h2></div><div class="grid">${users.filter(u=>!state.friends.includes(u.id)&&u.id!==state.currentUser.id).slice(0,8).map(friendCard).join("")}</div></section></div>`
}
function friendCard(u){
 const isFriend=state.friends.includes(u.id), pending=state.friendRequests.includes(u.id);
 return `<article style="padding:15px;border:1px solid var(--border);background:var(--surface);border-radius:18px"><img src="${u.avatar}" style="width:58px;height:58px;border-radius:50%;object-fit:cover" alt="${u.name}"><div style="margin-top:10px"><strong style="font:700 15px Manrope">${u.name}</strong><div class="username">@${u.username}</div><div class="sub" style="margin-top:5px">${u.location}</div><div class="sub" style="margin-top:5px">${u.places} places · ${u.countries} countries</div></div><div class="action-row">${isFriend?`<button class="secondary" onclick="openProfile('${u.id}')">View profile</button><button class="icon-btn" onclick="removeFriend('${u.id}')" title="Remove"><i class="bi bi-person-dash"></i></button>`:`<button class="primary" onclick="addFriend('${u.id}')">${pending?"Pending":"Add Friend"}</button>`}</div></article>`
}
function profileScreen(u,isFriend){
 const isMe=u.id===state.currentUser.id;
 return `<div class="screen"><div class="profile-cover"><img src="${img(images[(u.places)%images.length])}" alt=""></div><div class="profile-header"><img class="profile-avatar" src="${u.avatar}" alt="${u.name}"><h1>${escapeHtml(u.name)}</h1><div class="username">@${escapeHtml(u.username)}</div><p class="sub">${escapeHtml(u.bio)}</p><div class="sub"><i class="bi bi-geo-alt"></i> ${escapeHtml(u.location)}</div><div class="stats"><div class="stat"><strong>${u.places}</strong><span>PLACES</span></div><div class="stat"><strong>${u.countries}</strong><span>COUNTRIES</span></div><div class="stat"><strong>${u.friends}</strong><span>FRIENDS</span></div></div>${isMe?`<div class="action-row"><button class="secondary" onclick="openSheet('editProfile')">Edit Profile</button><button class="icon-btn" onclick="navigate('settings')"><i class="bi bi-gear"></i></button></div>`:``}</div>
 ${isFriend?`<div class="action-row" style="padding:0 17px"><button class="secondary" onclick="removeFriend('${u.id}')">Remove Friend</button></div>`:""}
 <div class="profile-tabs">${["posts","bucket","saved"].map(t=>`<button class="${state.profileTab===t?'active':''}" onclick="state.profileTab='${t}';render()">${t==="posts"?"Recent Posts":t==="bucket"?"Bucket List":"Saved Places"}</button>`).join("")}</div>
 ${state.profileTab==="posts"?profilePosts(u):state.profileTab==="bucket"?`<div class="info-list">${state.bucketList.slice(0,4).map(b=>`<div class="info-row"><span>${b.country} · ${b.destination}</span><b>${b.status}</b></div>`).join("")}</div>`:`<div class="grid">${restaurants.slice(0,4).map(r=>`<div><div class="dest-img" style="height:160px"><img src="${r.image}" alt=""></div><div class="meta"><strong>${r.name}</strong><div class="tiny">${r.city} · ${r.rating}</div></div></div>`).join("")}</div>`}
 ${isFriend?`<section class="section"><div class="section-head"><h2>Travel Map Preview</h2></div><div class="mapfake"><span class="map-dot dot1"></span><span class="map-dot dot2"></span><span class="map-dot dot3"></span></div></section>`:""}
 </div>`
}
function profilePosts(u){return `<div>${posts.filter(p=>p.user===u.id).slice(0,3).map(postCard).join("")||`<div class="empty"><i class="bi bi-camera"></i>No posts yet</div>`}</div>`}
function postCard(p){
 const u=user(p.user), d=destinations.find(x=>x.id===p.destination)||dest("Kyoto");
 return `<article class="post"><div class="post-head"><img src="${u.avatar}" alt=""><div><strong>${u.name}</strong><span>@${u.username} · ${d.name}, ${d.country}</span></div><button class="icon-btn post-menu" onclick="openSheet('postActions','${p.id}')"><i class="bi bi-three-dots"></i></button></div><div class="post-media" onclick="openPost('${p.id}')"><img loading="lazy" src="${p.image}" alt="${d.name}"></div><div class="post-actions"><button class="${p.liked?'active':''}" onclick="toggleLike('${p.id}')"><i class="bi bi-heart${p.liked?'-fill':''}"></i></button><span class="count">${p.likes}</span><button onclick="openSheet('comments','${p.id}')"><i class="bi bi-chat"></i></button><span class="count">${p.comments}</span><button onclick="openSheet('share','${p.id}')"><i class="bi bi-share"></i></button><button class="${p.saved?'active':''}" style="margin-left:auto" onclick="toggleSave('${p.id}')"><i class="bi bi-bookmark${p.saved?'-fill':''}"></i></button></div><div class="post-caption">${escapeHtml(p.caption)}</div></article>`
}
function searchScreen(){
 const q=state.searchQuery.trim().toLowerCase();
 const ds=destinations.filter(d=>(d.name+" "+d.country).toLowerCase().includes(q)).slice(0,8);
 const us=users.filter(u=>(u.name+" "+u.username+" "+u.location).toLowerCase().includes(q)).slice(0,8);
 const rs=restaurants.filter(r=>(r.name+" "+r.city).toLowerCase().includes(q)).slice(0,5);
 return `<div class="screen"><div class="page-title"><button class="back" onclick="back()"><i class="bi bi-arrow-left"></i></button><h2>Search</h2></div><div class="search" style="margin-top:16px"><i class="bi bi-search"></i><input id="globalSearch" autofocus value="${escapeHtml(state.searchQuery)}" oninput="setSearch(this.value,'search')" placeholder="Countries, destinations, people..."></div>
 ${q?`<section class="section"><div class="section-head"><h2>Destinations</h2></div><div class="search-results">${ds.map(d=>resultRow(d.image,d.name,d.country,()=>openDestination(d.name))).join("")||emptySmall("No destinations found")}</div></section>
 <section class="section"><div class="section-head"><h2>Travelers</h2></div><div class="search-results">${us.map(u=>resultRow(u.avatar,u.name,"@"+u.username,()=>openProfile(u.id))).join("")||emptySmall("No travelers found")}</div></section>
 <section class="section"><div class="section-head"><h2>Restaurants</h2></div><div class="search-results">${rs.map(r=>resultRow(r.image,r.name,r.city,()=>{})).join("")||emptySmall("No restaurants found")}</div></section>`:`<div class="empty" style="margin-top:70px"><i class="bi bi-search"></i><div>Search the world, your friends and your saved places.</div></div>`}</div>`
}
function emptySmall(t){return `<div class="empty">${t}</div>`}
/* result rows need real inline navigation without serialized functions */
function resultRow(image,title,sub,fn){
 const action=fn.name==="openDestination"?`openDestination('${escapeHtml(title)}')`:fn.name==="openProfile"?`openProfile('${users.find(u=>u.name===title)?.id||""}')`:"";
 return `<button class="result" onclick="${action}"><img src="${image}" alt=""><div class="grow" style="text-align:left"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(sub)}</small></div><i class="bi bi-chevron-right"></i></button>`
}
function notifications(){
 const groups={Today:state.notifications.filter(n=>n.time==="Today"),Yesterday:state.notifications.filter(n=>n.time==="Yesterday"),Earlier:state.notifications.filter(n=>n.time==="Earlier")};
 return `<div class="screen"><div class="eyebrow">Updates</div><h1>Notifications</h1>${Object.entries(groups).map(([g,arr])=>arr.length?`<section class="section"><div class="eyebrow">${g}</div>${arr.map(n=>`<div class="notification"><img src="${user(n.user).avatar}" alt=""><div><p>${escapeHtml(n.text)}</p><time>${g}</time></div></div>`).join("")}</section>`:"").join("")}</div>`
}
function createScreen(){
 return `<div class="screen"><div class="page-title"><button class="back" onclick="back()"><i class="bi bi-x-lg"></i></button><div><div class="eyebrow">New</div><h2>Create Post</h2></div></div><div class="section"><div class="skeleton skeleton-img" id="postPreview"></div><div class="field"><label>Photo URL</label><input id="postImage" placeholder="Paste an image URL" value="${img(images[2],900,1000)}" oninput="document.getElementById('postPreview').innerHTML='<img src=&quot;'+this.value+'&quot; style=&quot;width:100%;height:100%;object-fit:cover&quot;>'"></div><div class="field"><label>Destination</label><select id="postDestination">${destinations.slice(0,25).map(d=>`<option value="${d.id}">${d.name}, ${d.country}</option>`).join("")}</select></div><div class="field"><label>Caption</label><textarea id="postCaption" placeholder="What made this place worth remembering?"></textarea></div><div class="field"><label>Post type</label><select id="postType"><option>Photo</option><option>Destination recommendation</option><option>Travel note</option><option>Restaurant recommendation</option></select></div><button class="primary" style="width:100%;margin-top:5px" onclick="publishPost()">Publish <i class="bi bi-arrow-up-right"></i></button></div></div>`
}
function postDetails(){
 const p=posts.find(x=>x.id===state.selectedPost)||posts[0], u=user(p.user), d=destinations.find(x=>x.id===p.destination);
 return `<div class="screen"><div class="page-title"><button class="back" onclick="back()"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">Post</div><span class="sub">${d.name}, ${d.country}</span></div></div><div style="margin-top:18px">${postCard(p)}</div><section class="section"><div class="section-head"><h2>Comments</h2></div><div class="activity-list"><div class="activity"><img src="${users[2].avatar}"><div><p><b>${users[2].name}</b> This one is going straight onto my list.</p><time>12 min ago</time></div></div><div class="activity"><img src="${users[4].avatar}"><div><p><b>${users[4].name}</b> The composition here is perfect.</p><time>Yesterday</time></div></div></div></section></div>`
}
function settings(){
 const rows=[
  ["person","Account","Profile, username and personal details","navigate('profile')"],
  ["moon","Appearance","Dark mode is active",""],
  ["shield-check","Privacy","Control how your profile is shared",""],
  ["bell","Notifications","Likes, comments and friend activity",""],
  ["airplane","Travel Preferences","Destinations, food and activities",""],
  ["info-circle","About","Veyra · frontend edition",""]
 ];
 return `<div class="screen"><div class="page-title"><button class="back" onclick="back()"><i class="bi bi-arrow-left"></i></button><div><div class="eyebrow">Preferences</div><h2>Settings</h2></div></div>${rows.map((r,i)=>`<section class="settings-group"><div class="setting" onclick="${r[3]}"><i class="bi bi-${r[0]}"></i><div class="grow"><strong>${r[1]}</strong><small>${r[2]}</small></div>${i===1?`<button class="switch ${state.settings.dark?'on':''}" onclick="event.stopPropagation();toggleSetting('dark')"></button>`:i===3?`<button class="switch ${state.settings.notifications?'on':''}" onclick="event.stopPropagation();toggleSetting('notifications')"></button>`:i===0?`<i class="bi bi-chevron-right" style="color:var(--faint)"></i>`:""}</div></section>`).join("")}
 <section class="settings-group"><div class="eyebrow">Interface</div><div class="setting"><i class="bi bi-speedometer2"></i><div class="grow"><strong>Reduced motion</strong><small>Use minimal transitions</small></div><button class="switch ${state.settings.reduced?'on':''}" onclick="toggleSetting('reduced')"></button></div><div class="setting"><i class="bi bi-layout-text-window"></i><div class="grow"><strong>Compact mode</strong><small>Tighter information density</small></div><button class="switch ${state.settings.compact?'on':''}" onclick="toggleSetting('compact')"></button></div><div class="setting"><i class="bi bi-lock"></i><div class="grow"><strong>Private profile</strong><small>Only friends can see your travel activity</small></div><button class="switch ${state.settings.private?'on':''}" onclick="toggleSetting('private')"></button></div></section>
 </div>`
}

function navigate(screen,push=true){
 if(push && state.screen!==screen)state.history.push(state.screen);
 state.screen=screen; state.searchQuery="";state.activeCategory="All";render();window.scrollTo({top:0,behavior:"smooth"});
}
function back(){const s=state.history.pop()||"home";state.screen=s;render();window.scrollTo(0,0)}
function openDestination(name){const d=dest(name);state.selectedDestination=d;state.history.push(state.screen);state.screen="destination";render();window.scrollTo(0,0)}
function openCountry(){state.history.push(state.screen);state.screen="country";render()}
function openBucketDestination(name){state.selectedDestination=dest(name);state.history.push(state.screen);state.screen="bucketDestination";render();window.scrollTo(0,0)}
function openProfile(id){state.selectedProfile=user(id);state.history.push(state.screen);state.screen="friend";render();window.scrollTo(0,0)}
function openPost(id){state.selectedPost=id;state.history.push(state.screen);state.screen="post";render();window.scrollTo(0,0)}
function setSearch(v,from){state.searchQuery=v;if(from==="explore"){render();setTimeout(()=>{const e=document.getElementById("exploreSearch");if(e){e.focus();e.setSelectionRange(v.length,v.length)}},0)}else render()}
function setCategory(c){state.activeCategory=c;render()}
function setBucketFilter(s){state.activeCategory=s;render()}
function toggleCountry(c){state.openCountry=state.openCountry===c?null:c;render()}
function toggleBucket(name){
 const d=dest(name), i=state.bucketList.findIndex(b=>b.destination===d.name);
 if(i>=0){state.bucketList.splice(i,1);toast(`${d.name} removed from your bucket list`)}
 else{state.bucketList.push({destination:d.name,country:d.country,status:"Want to Visit",priority:"Medium",notes:"Add a note about why you want to go."});toast(`Added ${d.name} to your bucket list`)}
 render()
}
function cycleStatus(name){
 const b=state.bucketList.find(x=>x.destination===name);if(!b)return;
 const seq=["Want to Visit","Planning","Booked","Visited"];b.status=seq[(seq.indexOf(b.status)+1)%seq.length];toast(`${name} is now ${b.status}`);render()
}
function removeBucket(name){state.bucketList=state.bucketList.filter(b=>b.destination!==name);toast(`${name} removed`);back()}
function addFriend(id){if(!state.friends.includes(id)&&!state.friendRequests.includes(id)){state.friendRequests.push(id);toast(`Friend request sent to ${user(id).name}`);render()}}
function removeFriend(id){state.friends=state.friends.filter(x=>x!==id);toast(`${user(id).name} removed from friends`);render()}
function toggleLike(id){const p=posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}
function toggleSave(id){const p=posts.find(x=>x.id===id);p.saved=!p.saved;toast(p.saved?"Saved to your collection":"Removed from saved");render()}
function publishPost(){
 const image=document.getElementById("postImage").value.trim()||img(images[1]);
 const destination=document.getElementById("postDestination").value;
 const caption=document.getElementById("postCaption").value.trim()||"A place worth remembering.";
 posts.unshift({id:"p"+Date.now(),user:state.currentUser.id,destination,image,caption,likes:0,comments:0,liked:false,saved:false,type:"photo"});
 toast("Post published");state.history=[];state.screen="home";render()
}
function toggleSetting(k){state.settings[k]=!state.settings[k];if(k==="reduced")document.documentElement.style.setProperty("--ease",state.settings[k]?"linear":"cubic-bezier(.2,.8,.2,1)");render();toast(`${k==="private"?"Privacy":k[0].toUpperCase()+k.slice(1)} updated`)}
function openSheet(type,id){
 const sheet=document.getElementById("sheet"),overlay=document.getElementById("overlay");
 let body="";
 if(type==="add")body=`<div class="grab"></div><div class="sheet-head"><h2>Add Destination</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="field"><label>Country</label><select id="addCountry">${countries.map(c=>`<option>${c[0]}</option>`).join("")}</select></div><div class="field"><label>Destination</label><select id="addDestination">${destinations.map(d=>`<option>${d.name}</option>`).join("")}</select></div><div class="field"><label>Priority</label><select id="addPriority"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field"><label>Status</label><select id="addStatus"><option>Want to Visit</option><option>Planning</option><option>Booked</option><option>Visited</option></select></div><div class="field"><label>Notes</label><textarea id="addNotes" placeholder="Why do you want to go?"></textarea></div><button class="primary" style="width:100%" onclick="addDestinationFromSheet()">Save to bucket list</button>`;
 if(type==="comments")body=`<div class="grab"></div><div class="sheet-head"><h2>Comments</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="activity-list"><div class="activity"><img src="${users[2].avatar}"><div><p><b>Maya Chen</b> This place is beautiful.</p><time>12 min ago</time></div></div><div class="activity"><img src="${users[4].avatar}"><div><p><b>Lina Rossi</b> Adding this to my list.</p><time>Yesterday</time></div></div></div><div class="field"><input placeholder="Write a comment..." id="commentInput"></div><button class="primary" style="width:100%" onclick="toast('Comment added');closeSheet()">Comment</button>`;
 if(type==="share")body=`<div class="grab"></div><div class="sheet-head"><h2>Share</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="info-list"><button class="info-row" onclick="toast('Link copied');closeSheet()"><span><i class="bi bi-link-45deg"></i> Copy link</span><i class="bi bi-chevron-right"></i></button><button class="info-row" onclick="toast('Shared with friends');closeSheet()"><span><i class="bi bi-people"></i> Send to friends</span><i class="bi bi-chevron-right"></i></button></div>`;
 if(type==="postActions")body=`<div class="grab"></div><div class="sheet-head"><h2>Post actions</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="info-list"><button class="info-row" onclick="toggleSave('${id}');closeSheet()"><span><i class="bi bi-bookmark"></i> Save post</span></button><button class="info-row" onclick="toast('Post link copied');closeSheet()"><span><i class="bi bi-link-45deg"></i> Copy link</span></button><button class="info-row" onclick="toast('Post hidden');closeSheet()"><span><i class="bi bi-eye-slash"></i> Hide post</span></button></div>`;
 if(type==="editProfile")body=`<div class="grab"></div><div class="sheet-head"><h2>Edit Profile</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="field"><label>Display name</label><input id="editName" value="${escapeHtml(state.currentUser.name)}"></div><div class="field"><label>Username</label><input id="editUsername" value="${escapeHtml(state.currentUser.username)}"></div><div class="field"><label>Bio</label><textarea id="editBio">${escapeHtml(state.currentUser.bio)}</textarea></div><button class="primary" style="width:100%" onclick="saveProfile()">Save profile</button>`;
 if(type==="plan")body=`<div class="grab"></div><div class="sheet-head"><h2>Plan Trip</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><p class="sub">This frontend-only planner keeps your first pass local.</p><div class="field"><label>Trip length</label><select><option>4–6 days</option><option>7–10 days</option><option>10+ days</option></select></div><div class="field"><label>Notes</label><textarea placeholder="What do you want this trip to feel like?"></textarea></div><button class="primary" style="width:100%" onclick="toast('Trip plan saved locally');closeSheet()">Save plan</button>`;
 if(type==="editBucket")body=`<div class="grab"></div><div class="sheet-head"><h2>Edit Destination</h2><button class="icon-btn" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button></div><div class="field"><label>Status</label><select id="editStatus">${["Want to Visit","Planning","Booked","Visited"].map(x=>`<option ${x===state.bucketList.find(b=>b.destination===state.selectedDestination.name)?.status?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Notes</label><textarea id="editNotes">${escapeHtml(state.bucketList.find(b=>b.destination===state.selectedDestination.name)?.notes||"")}</textarea></div><button class="primary" style="width:100%" onclick="saveBucketEdit()">Save changes</button>`;
 sheet.innerHTML=body;sheet.classList.add("show");overlay.classList.add("show")
}
function addDestinationFromSheet(){
 const name=document.getElementById("addDestination").value,d=dest(name);
 if(!state.bucketList.some(b=>b.destination===name))state.bucketList.push({destination:name,country:d.country,status:document.getElementById("addStatus").value,priority:document.getElementById("addPriority").value,notes:document.getElementById("addNotes").value||"Add a note about why you want to go."});
 toast(`Added ${name} to your bucket list`);closeSheet();render()
}
function saveProfile(){
 state.currentUser.name=document.getElementById("editName").value||state.currentUser.name;
 state.currentUser.username=document.getElementById("editUsername").value||state.currentUser.username;
 state.currentUser.bio=document.getElementById("editBio").value||state.currentUser.bio;
 toast("Profile updated");closeSheet();render()
}
function saveBucketEdit(){
 const b=state.bucketList.find(x=>x.destination===state.selectedDestination.name);if(b){b.status=document.getElementById("editStatus").value;b.notes=document.getElementById("editNotes").value}
 toast("Bucket list updated");closeSheet();render()
}
function closeSheet(){document.getElementById("sheet").classList.remove("show");document.getElementById("overlay").classList.remove("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),2200)}
function bind(){
 document.querySelectorAll(".post-media img").forEach(im=>im.addEventListener("error",()=>im.style.opacity=".4"));
}

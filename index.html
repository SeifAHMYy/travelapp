<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Veyra — Travel Beyond</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;350;400;450;500;550;600;650;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f8fafc;
            --bg-elevated: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-glass-solid: #fafbfc;
            --border: rgba(0, 0, 0, 0.07);
            --border-subtle: rgba(0, 0, 0, 0.035);
            --border-active: rgba(0, 0, 0, 0.12);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-inverse: #ffffff;
            --accent: #0d9488;
            --accent-light: #0f766e;
            --accent-glow: rgba(13, 148, 136, 0.16);
            --accent-subtle: rgba(13, 148, 136, 0.06);
            --accent-strong: rgba(13, 148, 136, 0.22);
            --danger: #e05858;
            --success: #0d9488;
            --info: #3b82f6;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --blur: blur(28px);
            --blur-light: blur(14px);
            --transition-fast: 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition: 300ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-xs: 0.7rem;
            --font-sm: 0.8rem;
            --font-base: 0.92rem;
            --font-md: 1.02rem;
            --font-lg: 1.18rem;
            --font-xl: 1.5rem;
            --font-2xl: 1.9rem;
            --font-3xl: 2.4rem;
            --font-4xl: 3rem;
            --letter-spacing-tight: -0.025em;
            --letter-spacing-normal: -0.01em;
            --letter-spacing-wide: 0.05em;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-height: 68px;
            --sidebar-width: 230px;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #273449;
            --bg-elevated: #1e293b;
            --bg-glass: rgba(15, 23, 42, 0.82);
            --bg-glass-solid: #1a2332;
            --border: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-active: rgba(255, 255, 255, 0.13);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --text-inverse: #0f172a;
            --accent: #2dd4bf;
            --accent-light: #5eead4;
            --accent-glow: rgba(45, 212, 191, 0.18);
            --accent-subtle: rgba(45, 212, 191, 0.07);
            --accent-strong: rgba(45, 212, 191, 0.25);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.55);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
            background: var(--bg);
            color: var(--text-primary);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.55;
            letter-spacing: var(--letter-spacing-normal);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            transition: background var(--transition), color var(--transition);
        }
        ::selection {
            background: var(--accent);
            color: #fff;
        }
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(128, 128, 128, 0.35);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #app {
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }
        .main-content {
            flex: 1;
            margin-left: 0;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
            transition: margin-left var(--transition);
            min-height: 100vh;
            overflow-y: auto;
        }
        .sidebar {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-right: 1px solid var(--border);
            z-index: 100;
            flex-direction: column;
            padding: 22px 14px;
            gap: 4px;
            transition: transform var(--transition), background var(--transition);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: var(--font-lg);
            letter-spacing: var(--letter-spacing-tight);
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            border-radius: var(--radius);
        }
        .sidebar-brand .brand-icon {
            color: #fff;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.04em;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--font-sm);
            font-weight: 450;
            letter-spacing: var(--letter-spacing-normal);
            transition: all var(--transition-fast);
            cursor: pointer;
            position: relative;
        }
        .sidebar-nav a i {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            opacity: 0.65;
            transition: opacity var(--transition-fast);
        }
        .sidebar-nav a:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
        .sidebar-nav a:hover i {
            opacity: 1;
        }
        .sidebar-nav a.active {
            background: var(--accent-subtle);
            color: var(--accent-light);
            font-weight: 550;
        }
        .sidebar-nav a.active i {
            opacity: 1;
            color: var(--accent);
        }
        .sidebar-nav a.active::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 18px;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
        }
        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background var(--transition-fast);
            margin-top: auto;
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
        }
        .sidebar-user:hover {
            background: var(--bg-surface-hover);
        }
        .sidebar-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }
        .sidebar-user-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .sidebar-user-name {
            font-size: var(--font-xs);
            font-weight: 550;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-user-username {
            font-size: 0.66rem;
            color: var(--text-muted);
        }
        .bottom-nav {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-top: 1px solid var(--border);
            padding: 6px 8px calc(6px + var(--safe-bottom));
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            transition: all var(--transition);
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 450;
            letter-spacing: 0.02em;
            padding: 4px 10px;
            border-radius: var(--radius-lg);
            transition: all var(--transition-fast);
            cursor: pointer;
            position: relative;
            min-width: 44px;
        }
        .bottom-nav a i {
            font-size: 1.25rem;
            transition: all var(--transition-fast);
        }
        .bottom-nav a.active {
            color: var(--accent-light);
        }
        .bottom-nav a.active i {
            color: var(--accent);
        }
        .bottom-nav a.active::after {
            content: '';
            position: absolute;
            top: -7px;
            width: 16px;
            height: 2px;
            background: var(--accent);
            border-radius: 0 0 2px 2px;
        }
        .page {
            display: none;
            animation: pageIn var(--transition) ease forwards;
        }
        .page.active {
            display: block;
        }
        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-content {
            max-width: 1120px;
            margin: 0 auto;
            padding: 18px 14px 36px;
        }
        @media(min-width:769px) {
            .page-content {
                padding: 26px 24px 44px;
            }
        }
        @media(min-width:1200px) {
            .page-content {
                padding: 30px 36px 52px;
            }
        }
        .eyebrow {
            font-size: var(--font-xs);
            font-weight: 550;
            letter-spacing: var(--letter-spacing-wide);
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .heading-xl {
            font-size: var(--font-3xl);
            font-weight: 700;
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.1;
            color: var(--text-primary);
        }
        .heading-lg {
            font-size: var(--font-2xl);
            font-weight: 650;
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.14;
            color: var(--text-primary);
        }
        .heading-md {
            font-size: var(--font-xl);
            font-weight: 600;
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.18;
            color: var(--text-primary);
        }
        .text-body {
            font-size: var(--font-base);
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .text-meta {
            font-size: var(--font-xs);
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: var(--font-sm);
            font-weight: 500;
            letter-spacing: var(--letter-spacing-normal);
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
            white-space: nowrap;
            font-family: inherit;
            text-decoration: none;
            outline: none;
        }
        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            font-weight: 550;
        }
        .btn-accent:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-accent:active {
            transform: scale(0.97);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            border-color: var(--border-active);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: var(--font-xs);
            border-radius: var(--radius-sm);
        }
        .btn-bookmark {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--blur-light);
            -webkit-backdrop-filter: var(--blur-light);
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #475569;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .btn-bookmark:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #fff;
        }
        .btn-bookmark.saved {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        [data-theme="dark"] .btn-bookmark {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        [data-theme="dark"] .btn-bookmark:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 0, 0, 0.65);
        }
        [data-theme="dark"] .btn-bookmark.saved {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition);
            cursor: pointer;
        }
        .card:hover {
            border-color: var(--border-active);
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .card-image {
            width: 100%;
            object-fit: cover;
            display: block;
            aspect-ratio: 4/3;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card:hover .card-image {
            transform: scale(1.04);
        }
        .card-body {
            padding: 13px 15px;
        }
        .card-eyebrow {
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-title {
            font-size: var(--font-md);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.2;
        }
        .card-subtitle {
            font-size: var(--font-xs);
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .hero-destination {
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            aspect-ratio: 16/10;
            min-height: 280px;
            cursor: pointer;
        }
        .hero-destination img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .hero-destination:hover img {
            transform: scale(1.05);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.25) 40%, rgba(0, 0, 0, 0.02) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            pointer-events: none;
        }
        .hero-overlay .hero-country {
            font-size: var(--font-xs);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-overlay .hero-name {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: #fff;
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.08;
        }
        .hero-overlay .hero-desc {
            font-size: var(--font-sm);
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            max-width: 420px;
        }
        .scroll-row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            padding: 4px 0 14px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-row>* {
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        .scroll-card {
            width: 200px;
        }
        .scroll-card-sm {
            width: 150px;
        }
        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pill {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: var(--font-xs);
            font-weight: 450;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            white-space: nowrap;
            font-family: inherit;
        }
        .pill:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background: var(--bg-surface-hover);
        }
        .pill.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 500;
        }
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 11px 16px;
            transition: all var(--transition-fast);
            position: relative;
        }
        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
            background: var(--bg-elevated);
        }
        .search-bar i {
            color: var(--text-muted);
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: var(--font-base);
            font-family: inherit;
            letter-spacing: var(--letter-spacing-normal);
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border-active);
            border-radius: var(--radius-lg);
            margin-top: 6px;
            z-index: 50;
            max-height: 360px;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            display: none;
            animation: fadeIn 150ms ease;
        }
        .search-dropdown.visible {
            display: block;
        }
        .search-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid var(--border-subtle);
        }
        .search-dropdown-item:hover {
            background: var(--bg-surface-hover);
        }
        .search-dropdown-item img {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
        }
        .search-dropdown-item .sdi-info {
            flex: 1;
            min-width: 0;
        }
        .search-dropdown-item .sdi-name {
            font-size: var(--font-sm);
            font-weight: 550;
            color: var(--text-primary);
        }
        .search-dropdown-item .sdi-sub {
            font-size: var(--font-xs);
            color: var(--text-muted);
        }
        .search-dropdown-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: var(--font-sm);
        }
        .search-dropdown-section {
            padding: 8px 16px 4px;
            font-size: 0.63rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            font-weight: 550;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 200ms ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-sheet {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            max-height: 85dvh;
            overflow-y: auto;
            padding: 20px 20px 28px;
            animation: slideUp 320ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: var(--shadow-lg);
        }
        @keyframes slideUp {
            from {

        function timeAgo(isoString) {
            const now = new Date();
            const then = new Date(isoString);
            const diffMs = now - then;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            const diffHrs = Math.floor(diffMins / 60);
            if (diffHrs < 24) return `${diffHrs}h ago`;
            const diffDays = Math.floor(diffHrs / 24);
            if (diffDays < 7) return `${diffDays}d ago`;
            return then.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2600);
        }

        function openModal(htmlContent) {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
              <div class="modal-sheet" onclick="event.stopPropagation()"><div class="modal-handle"></div>${htmlContent}</div>
            </div>`;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = '';
            document.body.style.overflow = ''; }

        function navigate(page, data = null) {
            state.currentPage = page;
            state.currentPageData = data;
            state.searchQuery = '';
            updateNavActive();
            renderPage();
            document.getElementById('mainContent').scrollTop = 0;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeModal();
            setTimeout(refreshAOS, 150);
        }

        function updateNavActive() {
            const page = state.currentPage;
            document.querySelectorAll('[data-nav]').forEach(el => {
                el.classList.toggle('active', el.dataset.nav === page || (page === 'destination' && el.dataset
                    .nav === 'explore') || (page === 'bucketlist-detail' && el.dataset.nav === 'bucketlist') ||
                    (page === 'friend-profile' && el.dataset.nav === 'friends') || (page === 'shared-bl-feed' && el
                        .dataset.nav === 'bucketlist') || (page === 'settings' && el.dataset.nav === 'profile'));
            });
        }

        function applyTheme() {
            const isDark = state.settings.darkMode;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }

        function toggleTheme() {
            state.settings.darkMode = !state.settings.darkMode;
            applyTheme();
            renderPage();
            showToast(state.settings.darkMode ? 'Dark mode' : 'Light mode');
        }

        function DestinationCard(dest, size = 'normal') {
            const isSmall = size === 'small';
            const w = isSmall ? 150 : 200;
            const inBL = isInBucketList(dest.id);
            const flagHtml = flagImgTag(dest.country, 40, 'flag-icon-sm');
            return `
            <div class="card scroll-card${isSmall?' scroll-card-sm':''} aos-item" onclick="navigate('destination','${dest.id}')" style="width:${w}px;">
              <div style="position:relative;overflow:hidden;">
                <img class="card-image" src="${dest.image}" alt="${dest.name}" loading="lazy" style="aspect-ratio:${isSmall?'1/1':'4/3'};">
                <button class="btn-bookmark${inBL?' saved':''}" style="position:absolute;top:8px;right:8px;z-index:2;" onclick="event.stopPropagation();toggleBucketList('${dest.id}')"><i class="bi bi-bookmark${inBL?'-fill':''}" style="font-size:0.85rem;"></i></button>
              </div>
              <div class="card-body"><div class="card-eyebrow">${flagHtml}${dest.country}</div><div class="card-title">${dest.name}</div><div class="card-subtitle">${dest.desc.slice(0,48)}...</div></div>
            </div>`;
        }

        function FriendCard(user, showActions = true) {
            const isF = isFriend(user.id);
            const reqStatus = getFriendRequestStatus(user.id);
            return `
            <div class="friend-card aos-item" onclick="navigate('friend-profile','${user.id}')">
              <img class="friend-avatar" src="${user.avatar}" alt="${user.displayName}" loading="lazy">
              <div class="friend-info"><div class="friend-name">${user.displayName}</div><div class="friend-username">${user.username}</div><div class="friend-stats">${user.location} · ${user.stats.places} Places</div></div>
              ${showActions ? `
              <div style="flex-shrink:0;">
                ${isF ? `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();removeFriend('${user.id}')">Following</button>` :
                  reqStatus==='sent' ? `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();cancelFriendRequest('${user.id}')">Pending</button>` :
                  reqStatus==='received' ? `<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();acceptFriend('${user.id}')">Accept</button>` :
                  `<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();sendFriendRequest('${user.id}')">Add Friend</button>`
                }
              </div>` : ''}
            </div>`;
        }

        function PostCard(post) {
            const user = getUser(post.userId);
            if (!user) return '';
            return `
            <div class="post-card aos-item" onclick="navigate('post-detail','${post.id}')">
              <img class="post-image" src="${post.image}" alt="Post" loading="lazy">
              <div class="post-body">
                <div class="post-header">
                  <img class="post-avatar" src="${user.avatar}" alt="${user.displayName}" loading="lazy" onclick="event.stopPropagation();navigate('friend-profile','${post.userId}')">
                  <div style="flex:1;min-width:0;"><div class="post-user">${user.displayName}</div><div class="post-username">${user.username}</div></div>
                  <div class="post-location"><i class="bi bi-geo-alt"></i>${post.location}</div>
                </div>
                <p class="post-caption">${post.caption}</p>
                <div class="post-actions">
                  <button class="post-action${post.liked?' liked':''}" onclick="event.stopPropagation();toggleLike('${post.id}')"><i class="bi bi-heart${post.liked?'-fill':''}"></i>${post.likes}</button>
                  <button class="post-action" onclick="event.stopPropagation();"><i class="bi bi-chat"></i>${post.comments}</button>
                  <button class="post-action${post.saved?' saved-post':''}" onclick="event.stopPropagation();toggleSavePost('${post.id}')"><i class="bi bi-bookmark${post.saved?'-fill':''}"></i>Save</button>
                  <button class="post-action" onclick="event.stopPropagation();"><i class="bi bi-share"></i></button>
                </div>
              </div>
            </div>`;
        }

        function getStatusDotClass(status) {
            const s = status.toLowerCase();
            if (s.includes('visit') && !s.includes('ed') && s.includes('want')) return 'want';
            if (s.includes('plan')) return 'planning';
            if (s.includes('book')) return 'booked';
            if (s.includes('visit') && s.includes('ed')) return 'visited';
            return 'custom';
        }

        function toggleBucketList(destId) {
            const existing = getBucketEntry(destId);
            if (existing) {
                state.bucketList = state.bucketList.filter(b => b.destinationId !== destId);
                showToast('Removed from your bucket list');
            } else {
                state.bucketList.push({ destinationId: destId, status: 'Want to Visit', addedDate: new Date()
                        .toISOString(), notes: '', desireLevel: 3, visitedDate: null, visitedDuration: null });
                showToast('Added to your bucket list');
            }
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function changeBucketStatus(destId, status) {
            const entry = getBucketEntry(destId);
            if (entry) {
                entry.status = status;
                if (status === 'Visited' && !entry.visitedDate) { entry.visitedDate = new Date().toISOString().split(
                        'T')[0];
                    entry.visitedDuration = entry.visitedDuration || 3; }
                showToast(`Status updated to "${status}"`);
                renderPage();
                setTimeout(refreshAOS, 150);
            }
        }

        function updateBucketEntryField(destId, field, value) {
            const entry = getBucketEntry(destId);
            if (entry) { entry[field] = value;
                renderPage();
                setTimeout(refreshAOS, 150); }
        }

        function removeFromBucket(destId) {
            state.bucketList = state.bucketList.filter(b => b.destinationId !== destId);
            showToast('Removed from your bucket list');
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function sendFriendRequest(userId) {
            if (!state.friendRequests.sent.includes(userId) && !state.friends.includes(userId)) {
                state.friendRequests.sent.push(userId);
                state.friendRequests.received = state.friendRequests.received.filter(id => id !== userId);
                showToast('Friend request sent');
                renderPage();
                setTimeout(refreshAOS, 150);
            }
        }

        function acceptFriend(userId) {
            state.friendRequests.received = state.friendRequests.received.filter(id => id !== userId);
            if (!state.friends.includes(userId)) state.friends.push(userId);
            state.notifications.unshift({ id: 'n' + Date.now(), type: 'friend_accept', userId: userId,
                text: 'accepted your friend request', time: new Date().toISOString(), read: false });
            showToast('Friend request accepted');
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function removeFriend(userId) { state.friends = state.friends.filter(id => id !== userId);
            showToast('Friend removed');
            renderPage();
            setTimeout(refreshAOS, 150); }

        function cancelFriendRequest(userId) { state.friendRequests.sent = state.friendRequests.sent.filter(id => id !==
                userId);
            showToast('Friend request cancelled');
            renderPage();
            setTimeout(refreshAOS, 150); }

        function toggleLike(postId) {
            const post = postsData.find(p => p.id === postId);
            if (post) { post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                renderPage();
                setTimeout(refreshAOS, 150); }
        }

        function toggleSavePost(postId) {
            const post = postsData.find(p => p.id === postId);
            if (post) { post.saved = !post.saved;
                showToast(post.saved ? 'Post saved' : 'Post unsaved');
                renderPage();
                setTimeout(refreshAOS, 150); }
        }

        function createPost(destinationId, caption, imageUrl) {
            const dest = destinationId ? getDestination(destinationId) : null;
            const newPost = {
                id: 'p' + Date.now(),
                userId: state.currentUser.id,
                destinationId: destinationId || 'kyoto',
                location: dest ? dest.name + ', ' + dest.country : 'Somewhere',
                image: imageUrl || (dest ? dest.image : destinationsData[0].image),
                caption: caption || 'New adventure!',
                likes: 0,
                comments: 0,
                liked: false,
                saved: false,
                timestamp: new Date().toISOString()
            };
            postsData.unshift(newPost);
            showToast('Post published!');
            closeModal();
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function addDestinationToBucket(destId, desireLevel, status, notes) {
            if (!isInBucketList(destId)) {
                state.bucketList.push({ destinationId: destId, status: status || 'Want to Visit', addedDate: new Date()
                        .toISOString(), notes: notes || '', desireLevel: desireLevel || 3, visitedDate: null,
                    visitedDuration: null });
                showToast('Added to your bucket list');
            }
            closeModal();
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function addCustomStatus(name) {
            if (name && !state.customStatuses.includes(name)) { state.customStatuses.push(name);
                showToast(`Status "${name}" added`);
                renderPage();
                setTimeout(refreshAOS, 150); }
        }

        function deleteCustomStatus(name) {
            if (['Want to Visit', 'Planning', 'Booked', 'Visited'].includes(name)) { showToast(
                    'Cannot remove default statuses'); return; }
            state.customStatuses = state.customStatuses.filter(s => s !== name);
            state.bucketList.forEach(e => { if (e.status === name) e.status = 'Want to Visit'; });
            showToast(`Status "${name}" removed`);
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function createSharedBucketList(name, description, memberIds, destIds) {
            const newSBL = { id: 'sbl' + Date.now(), name, description, members: [state.currentUser.id,
                    ...memberIds
                ], destinations: destIds || [], posts: [], createdBy: state.currentUser.id, createdAt: new Date()
                    .toISOString() };
            state.sharedBucketLists.unshift(newSBL);
            showToast('Shared bucket list created!');
            closeModal();
            renderPage();
            setTimeout(refreshAOS, 150);
        }

        function addMessageToSharedBL(sblId, text) {
            const sbl = state.sharedBucketLists.find(s => s.id === sblId);
            if (sbl && text.trim()) {
                sbl.posts.push({ userId: state.currentUser.id, text: text.trim(), timestamp: new Date().toISOString() });
                showToast('Message sent');
                renderPage();
                setTimeout(refreshAOS, 150);
            }
        }

        function addDestToSharedBL(sblId, destId) {
            const sbl = state.sharedBucketLists.find(s => s.id === sblId);
            if (sbl && !sbl.destinations.includes(destId)) { sbl.destinations.push(destId);
                showToast('Destination added to shared list');
                renderPage();
                setTimeout(refreshAOS, 150); }
        }

        function renderSearchDropdown(query) {
            if (!query || query.length < 1) return '';
            const q = query.toLowerCase();
            const matchedDests = destinationsData.filter(d => d.name.toLowerCase().includes(q) || d.country.toLowerCase()
                .includes(q) || d.continent.toLowerCase().includes(q));
            const matchedUsers = usersData.filter(u => u.displayName.toLowerCase().includes(q) || u.username.toLowerCase()
                .includes(q));
            if (matchedDests.length === 0 && matchedUsers.length === 0) {
                return `<div class="search-dropdown visible"><div class="search-dropdown-empty">No results for "${query}"</div></div>`;
            }
            let html = '<div class="search-dropdown visible">';
            if (matchedDests.length > 0) {
                html += '<div class="search-dropdown-section">Destinations & Countries</div>';
                matchedDests.slice(0, 8).forEach(d => {
                    html += `
                <div class="search-dropdown-item" onclick="event.stopPropagation();navigate('destination','${d.id}');document.querySelectorAll('.search-dropdown').forEach(el=>el.classList.remove('visible'));">
                  <img src="${d.image}" alt="${d.name}" loading="lazy">
                  <div class="sdi-info"><div class="sdi-name">${d.name}, ${d.country}</div><div class="sdi-sub">${d.continent} · ${d.desc.slice(0,40)}...</div></div>
                  <i class="bi bi-arrow-right-short" style="color:var(--text-muted);"></i>
                </div>`;
                });
            }
            if (matchedUsers.length > 0) {
                html += '<div class="search-dropdown-section">People</div>';
                matchedUsers.slice(0, 5).forEach(u => {
                    html += `
                <div class="search-dropdown-item" onclick="event.stopPropagation();navigate('friend-profile','${u.id}');document.querySelectorAll('.search-dropdown').forEach(el=>el.classList.remove('visible'));">
                  <img src="${u.avatar}" alt="${u.displayName}" loading="lazy" style="border-radius:50%;">
                  <div class="sdi-info"><div class="sdi-name">${u.displayName}</div><div class="sdi-sub">${u.username} · ${u.location}</div></div>
                  <i class="bi bi-arrow-right-short" style="color:var(--text-muted);"></i>
                </div>`;
                });
            }
            html += '</div>';
            return html;
        }

        function renderPage() {
            const main = document.getElementById('mainContent');
            const page = state.currentPage;
            const data = state.currentPageData;
            updateNavActive();
            switch (page) {
                case 'home':
                    renderHome(main);
                    break;
                case 'explore':
                    renderExplore(main);
                    break;
                case 'destination':
                    renderDestination(main, data);
                    break;
                case 'bucketlist':
                    renderBucketList(main);
                    break;
                case 'bucketlist-detail':
                    renderBucketListDetail(main, data);
                    break;
                case 'shared-bl-feed':
                    renderSharedBLFeed(main, data);
                    break;
                case 'friends':
                    renderFriends(main);
                    break;
                case 'friend-profile':
                    renderFriendProfile(main, data);
                    break;
                case 'profile':
                    renderProfile(main);
                    break;
                case 'search':
                    renderSearch(main);
                    break;
                case 'notifications':
                    renderNotifications(main);
                    break;
                case 'post-detail':
                    renderPostDetail(main, data);
                    break;
                case 'settings':
                    renderSettings(main);
                    break;
                default:
                    renderHome(main);
            }
            setTimeout(refreshAOS, 120);
        }

        function renderHome(main) {
            const blDests = state.bucketList.map(b => getDestination(b.destinationId)).filter(Boolean);
            const friendPosts = postsData.slice(0, 4);
            const trending = destinationsData.slice(5, 10);
            main.innerHTML = `

              <p class="eyebrow">Your Journey</p>

                ${state.searchQuery?`<i class="bi bi-x" style="cursor:pointer;z-index:2;" onclick="event.stopPropagation();state.searchQuery='';document.getElementById('homeSearchInput').value='';renderPage()"></i>`:''}
                <div id="homeSearchDropdown" style="position:absolute;top:100%;left:0;right:0;z-index:50;">${renderSearchDropdown(state.searchQuery)}</div>
              </div>
              <div class="section-gap"><div class="flex-between mb-3"><h2 class="heading-md">Continue Exploring</h2></div>
                <div class="scroll-row hide-scrollbar">${destinationsData.slice(0,8).map((d,i) => DestinationCard(d).replace('aos-item','aos-item'+(i>0?` aos-delay-${Math.min(i,4)}`:''))).join('')}</div>
              </div>
              ${blDests.length>0?`<div class="section-gap"><div class="flex-between mb-3"><h2 class="heading-md">Your Bucket List</h2><span class="text-meta" style="cursor:pointer;" onclick="navigate('bucketlist')">View all</span></div><div class="scroll-row hide-scrollbar">${blDests.slice(0,6).map((d,i)=>DestinationCard(d,'small').replace('aos-item','aos-item'+(i>0?` aos-delay-${Math.min(i,4)}`:''))).join('')}</div></div>`:''}
              <div class="section-gap"><div class="flex-between mb-3"><h2 class="heading-md">Friends Are Traveling</h2></div>
                <div style="display:grid;gap:14px;grid-template-columns:1fr;">${friendPosts.map((p,i)=>PostCard(p).replace('aos-item','aos-item'+(i>0?` aos-delay-${Math.min(i,3)}`:''))).join('')}</div>

                <div class="scroll-row hide-scrollbar">${trending.map((d,i)=>DestinationCard(d).replace('aos-item','aos-item'+(i>0?` aos-delay-${Math.min(i,4)}`:''))).join('')}</div>
              </div>
            </div></div>`;
        }

                    ${state.searchQuery?`<i class="bi bi-x" style="cursor:pointer;z-index:2;" onclick="event.stopPropagation();state.searchQuery='';document.getElementById('exploreSearchInput').value='';renderPage()"></i>`:''}
                    <div id="exploreSearchDropdown" style="position:absolute;top:100%;left:0;right:0;z-index:50;">${renderSearchDropdown(state.searchQuery)}</div>

                    ${allCountries.slice(0,8).map(c=>`<button class="pill${filter===c?' active':''}" onclick="state.exploreFilter='${c}';renderPage()">${c}</button>`).join('')}

                        <div style="position:relative;overflow:hidden;"><img class="card-image" src="${d.image}" alt="${d.name}" loading="lazy"><button class="btn-bookmark${isInBucketList(d.id)?' saved':''}" style="position:absolute;top:8px;right:8px;z-index:2;" onclick="event.stopPropagation();toggleBucketList('${d.id}')"><i class="bi bi-bookmark${isInBucketList(d.id)?'-fill':''}" style="font-size:0.85rem;"></i></button></div>
                        <div class="card-body"><div class="card-eyebrow">${fHtml}${d.country}</div><div class="card-title">${d.name}</div><div class="card-subtitle">${d.desc.slice(0,70)}...</div></div>
                      </div>`;
                    }).join('')}
                  </div>${filtered.length===0?`<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="bi bi-compass" style="font-size:2rem;display:block;margin-bottom:8px;"></i>No destinations found.</div>`:''}</div>

                </div>
              </div>
            </div></div>`;
            setTimeout(() => {
                const container = document.getElementById('exploreSwipeContainer');
                if (container && state.exploreSwipeTab === 1) container.scrollLeft = container.offsetWidth;
                refreshAOS();
            }, 80);
        }

        function renderDestination(main, destId) {
            const dest = getDestination(destId);
            if (!dest) { navigate('home'); return; }
            const inBL = isInBucketList(destId);
            const flagHtml = flagImgTag(dest.country, 60);
            main.innerHTML = `
            <div class="page active">

        function renderBucketListDetail(main, destId) {
            const dest = getDestination(destId);
            const entry = getBucketEntry(destId);
            if (!dest || !entry) { navigate('bucketlist'); return; }
            const isVisited = entry.status === 'Visited';
            const flagHtml = flagImgTag(dest.country, 60, 'flag-icon-lg');
            const dl = entry.desireLevel || 3;
            const heartsHtml = Array.from({ length: 5 }, (_, i) =>
                `<span class="desire-heart${i < dl ? ' active' : ''}" style="font-size:1.3rem;" data-level="${i+1}">♥</span>`
                ).join('');
            main.innerHTML = `
            <div class="page active">
              <div class="hero-destination" style="border-radius:0;aspect-ratio:16/9;min-height:280px;"><img src="${dest.image}" alt="${dest.name}"><div class="hero-overlay"><div class="hero-country">${flagHtml}${dest.country}</div><div class="hero-name">${dest.name}</div></div></div>
              <div class="page-content">
                <div class="card" style="padding:20px;">
                  <div class="flex-between mb-3"><span class="text-meta">Saved: ${new Date(entry.addedDate).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span><span class="text-meta">Desire: ${desireLabels[dl]}</span></div>
                  <label>How much do you want to visit?</label>
                  <div class="desire-hearts mb-3" style="gap:4px;" id="detailDesireHearts">${heartsHtml}</div>
                  <span class="desire-label${dl>=3?' active-label':''}" id="detailDesireLabel" style="font-size:0.7rem;">${desireLabels[dl]}</span>
                  <label style="margin-top:10px;">Status</label>
                  <select onchange="handleBucketStatusChange(this,'${destId}')" style="width:100%;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-family:inherit;font-size:var(--font-sm);margin-bottom:10px;outline:none;">
                    ${state.customStatuses.map(s=>`<option value="${s}"${entry.status===s?' selected':''}>${s}</option>`).join('')}
                    <option disabled>───</option>
                    <option value="__manage__">Manage Custom Statuses...</option>
                  </select>
                  ${isVisited?`
                  <div class="flex-between mb-3" style="gap:12px;">
                    <div style="flex:1;"><label>Visited Date</label><input type="date" value="${entry.visitedDate||''}" onchange="updateBucketEntryField('${destId}','visitedDate',this.value)" style="width:100%;"></div>
                    <div style="flex:1;"><label>Duration (days)</label><input type="number" value="${entry.visitedDuration||''}" onchange="updateBucketEntryField('${destId}','visitedDuration',parseInt(this.value)||null)" placeholder="e.g. 5" min="1" style="width:100%;"></div>
                  </div>`:''}
                  <label>Notes</label>
                  <textarea rows="2" onchange="updateBucketEntryField('${destId}','notes',this.value)" style="width:100%;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-family:inherit;font-size:var(--font-sm);margin-bottom:10px;outline:none;resize:vertical;">${entry.notes||''}</textarea>
                  <div class="flex-between"><button class="btn btn-ghost btn-sm" onclick="removeFromBucket('${destId}');navigate('bucketlist')">Remove</button><button class="btn btn-accent btn-sm" onclick="openEditBucketModal('${destId}')">Edit Details</button></div>
                </div>
                ${isVisited && entry.visitedDate?`<div class="section-gap"><div class="card aos-item" style="padding:16px;text-align:center;"><p class="text-body">You visited <strong>${dest.name}</strong> on <strong>${new Date(entry.visitedDate).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</strong>${entry.visitedDuration?` for <strong>${entry.visitedDuration} day${entry.visitedDuration>1?'s':''}</strong>`:''}.</p></div></div>`:''}
              </div>
            </div>`;
            setTimeout(() => {
                const heartsContainer = document.getElementById('detailDesireHearts');
                if (heartsContainer) {
                    heartsContainer.querySelectorAll('.desire-heart').forEach(heart => {
                        heart.addEventListener('click', function() {
                            const level = parseInt(this.dataset.level);
                            updateBucketEntryField(destId, 'desireLevel', level);
                            renderPage();
                            setTimeout(refreshAOS, 150);
                        });
                    });
                }
            }, 100);
            window.handleBucketStatusChange = function(selectEl, destId) {
                if (selectEl.value === '__manage__') {
                    openManageStatusesModal();
                    const entry = getBucketEntry(destId);
                    selectEl.value = entry ? entry.status : 'Want to Visit';
                } else {
                    changeBucketStatus(destId, selectEl.value);
                }
            };
        }

            const countries = [...new Set(destinationsData.map(d => d.country))].sort();
            openModal(`<h3>Add to Bucket List</h3>
            <label>Country</label><select id="addDestCountry" onchange="updateAddDestOptions()"><option value="">Select country</option>${countries.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
            <label>Destination</label><select id="addDestName"><option value="">Select destination</option></select>
            <label>How much do you want to visit?</label>
            <div class="desire-level-container">
              <div class="desire-hearts" id="addDesireHearts">
                <span class="desire-heart active" data-level="1">♥</span>
                <span class="desire-heart active" data-level="2">♥</span>
                <span class="desire-heart active" data-level="3">♥</span>
                <span class="desire-heart" data-level="4">♥</span>
                <span class="desire-heart" data-level="5">♥</span>
              </div>
              <span class="desire-label active-label" id="addDesireLabel">Want to Visit</span>
            </div>
            <input type="hidden" id="addDesireLevel" value="3">
            <label>Status</label><select id="addDestStatus">${state.customStatuses.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <label>Notes</label><textarea id="addDestNotes" rows="2" placeholder="Any notes..."></textarea>
            <button class="btn btn-accent" style="width:100%;margin-top:10px;" onclick="submitAddDestination()">Add to Bucket List</button>`);
            window.updateAddDestOptions = function() {
                const country = document.getElementById('addDestCountry').value;
                const ds = document.getElementById('addDestName');
                ds.innerHTML = '<option value="">Select destination</option>';
                if (country) destinationsData.filter(d => d.country === country).forEach(d => { ds.innerHTML +=
                        `<option value="${d.id}"${isInBucketList(d.id)?' disabled':''}>${d.name}${isInBucketList(d.id)?' (already saved)':''}</option>`; });
            };
            window.submitAddDestination = function() {
                const destId = document.getElementById('addDestName').value;
                if (!destId) { showToast('Please select a destination'); return; }
                const dl = parseInt(document.getElementById('addDesireLevel').value) || 3;
                addDestinationToBucket(destId, dl, document.getElementById('addDestStatus').value, document
                    .getElementById('addDestNotes').value);
            };
            setTimeout(() => {
                const hearts = document.querySelectorAll('#addDesireHearts .desire-heart');
                const label = document.getElementById('addDesireLabel');
                const hidden = document.getElementById('addDesireLevel');
                hearts.forEach(heart => {
                    heart.addEventListener('click', function() {
                        const level = parseInt(this.dataset.level);
                        hidden.value = level;
                        label.textContent = desireLabels[level];
                        label.classList.toggle('active-label', level >= 3);
                        hearts.forEach((h, i) => h.classList.toggle('active', i < level));
                    });
                });
            }, 100);
        }

        function openEditBucketModal(destId) {
            const entry = getBucketEntry(destId);
            if (!entry) return;
            const dest = getDestination(destId);
            const dl = entry.desireLevel || 3;
            openModal(`<h3>Edit — ${dest?.name||destId}</h3>
            <label>Status</label><select id="editStatus">${state.customStatuses.map(s=>`<option value="${s}"${entry.status===s?' selected':''}>${s}</option>`).join('')}</select>
            <label>How much do you want to visit?</label>
            <div class="desire-level-container">
              <div class="desire-hearts" id="editDesireHearts">
                ${Array.from({length:5},(_,i)=>`<span class="desire-heart${i<dl?' active':''}" data-level="${i+1}">♥</span>`).join('')}
              </div>
              <span class="desire-label${dl>=3?' active-label':''}" id="editDesireLabel">${desireLabels[dl]}</span>
            </div>
            <input type="hidden" id="editDesireLevel" value="${dl}">
            <label>Notes</label><textarea id="editNotes" rows="2">${entry.notes||''}</textarea>
            <button class="btn btn-accent" style="width:100%;margin-top:10px;" onclick="submitEditBucket('${destId}')">Save Changes</button>`);
            window.submitEditBucket = function(id) {
                const e = getBucketEntry(id);
                if (e) { e.status = document.getElementById('editStatus').value;
                    e.desireLevel = parseInt(document.getElementById('editDesireLevel').value) || 3;
                    e.notes = document.getElementById('editNotes').value;
                    showToast('Bucket list updated');
                    closeModal();
                    renderPage();
                    setTimeout(refreshAOS, 150); }
            };
            setTimeout(() => {
                const hearts = document.querySelectorAll('#editDesireHearts .desire-heart');
                const label = document.getElementById('editDesireLabel');
                const hidden = document.getElementById('editDesireLevel');
                hearts.forEach(heart => {
                    heart.addEventListener('click', function() {
                        const level = parseInt(this.dataset.level);
                        hidden.value = level;
                        label.textContent = desireLabels[level];
                        label.classList.toggle('active-label', level >= 3);
                        hearts.forEach((h, i) => h.classList.toggle('active', i < level));
                    });
                });
            }, 100);
        }

        function openManageStatusesModal() {
            openModal(`<h3>Manage Custom Statuses</h3>
            <div style="max-height:300px;overflow-y:auto;margin-bottom:10px;">${state.customStatuses.map(s=>`<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-subtle);"><span style="font-size:var(--font-sm);color:var(--text-primary);">${s}</span>${['Want to Visit','Planning','Booked','Visited'].includes(s)?'<span class="text-meta" style="font-size:0.6rem;">default</span>':`<button class="btn btn-ghost btn-sm" onclick="deleteCustomStatus('${s}');closeModal();openManageStatusesModal();">Delete</button>`}</div>`).join('')}</div>
            <div style="display:flex;gap:8px;"><input type="text" id="newStatusName" placeholder="New status name..." style="flex:1;"><button class="btn btn-accent btn-sm" onclick="const v=document.getElementById('newStatusName').value.trim();if(v){addCustomStatus(v);closeModal();}">Add</button></div>
            <button class="btn btn-ghost btn-sm mt-3" style="width:100%;" onclick="closeModal()">Close</button>`);
        }

        function openCreatePostModal() {
            const destOptions = destinationsData.map(d =>
                `<option value="${d.id}">${d.name}, ${d.country}</option>`).join('');
            openModal(`<h3>Create a Post</h3>
            <label>Destination</label><select id="postDest"><option value="">Select destination (optional)</option>${destOptions}</select>
            <label>Caption</label><textarea id="postCaption" rows="3" placeholder="Share your travel story..."></textarea>
            <label>Image URL (optional)</label><input type="text" id="postImageUrl" placeholder="Leave blank to use destination image">
            <button class="btn btn-accent" style="width:100%;margin-top:10px;" onclick="submitCreatePost()">Publish Post</button>`);
            window.submitCreatePost = function() {
                const destId = document.getElementById('postDest').value || null;
                const caption = document.getElementById('postCaption').value.trim();
                const imageUrl = document.getElementById('postImageUrl').value.trim();
                if (!caption) { showToast('Please write a caption'); return; }
                createPost(destId, caption, imageUrl || null);
            };
        }

        function openCreateSharedBLModal() {
            const friendUsers = state.friends.map(id => getUser(id)).filter(Boolean);
            state.tempSelectedFriends = [];
            const friendRowsHtml = friendUsers.length === 0 ?
                `<div class="friend-select-none">No friends yet. Add friends first to share a bucket list.</div>` :
                friendUsers.map(u => `
                <div class="friend-select-row" data-user-id="${u.id}" onclick="toggleFriendSelectionRow(this)">
                  <img class="friend-select-avatar" src="${u.avatar}" alt="${u.displayName}" loading="lazy">
                  <div class="friend-select-info">
                    <span class="friend-select-name">${u.displayName}</span>
                    <span class="friend-select-username">${u.username}</span>
                  </div>
                  <div class="selection-circle"></div>
                </div>`).join('');
            openModal(`<h3>Create Shared Bucket List</h3>
            <label>Name</label><input type="text" id="sblName" placeholder="e.g. Summer Europe Trip">
            <label>Description</label><textarea id="sblDesc" rows="2" placeholder="What's this trip about?"></textarea>
            <div class="friend-select-section">
              <div class="friend-select-header"><label>Share with Friends</label><p class="friend-select-desc">Choose who can collaborate on this list</p></div>
              <div class="friend-search-wrapper"><i class="bi bi-search"></i><input type="text" id="friendSearchInput" placeholder="Search friends..." oninput="filterFriendSelectionRows(this.value)" autocomplete="off"></div>
              <div class="friend-select-list" id="friendSelectList">${friendRowsHtml}</div>
              <div class="friend-select-count" id="friendSelectCount">0 friends selected</div>
            </div>
            <button class="btn btn-accent" style="width:100%;margin-top:8px;" onclick="submitCreateSharedBL()">Create shared list</button>`);
            window.toggleFriendSelectionRow = function(row) {
                const userId = row.dataset.userId;
                const circle = row.querySelector('.selection-circle');
                row.classList.toggle('selected');
                circle.classList.toggle('selected');
                if (row.classList.contains('selected')) { if (!state.tempSelectedFriends.includes(userId)) state
                        .tempSelectedFriends.push(userId); } else { state.tempSelectedFriends = state.tempSelectedFriends
                        .filter(id => id !== userId); }
                updateFriendSelectCount();
            };
            window.filterFriendSelectionRows = function(query) {
                const q = query.toLowerCase().trim();
                document.querySelectorAll('#friendSelectList .friend-select-row').forEach(row => {
                    const name = (row.querySelector('.friend-select-name')?.textContent || '').toLowerCase();
                    const username = (row.querySelector('.friend-select-username')?.textContent || '')
                        .toLowerCase();
                    row.style.display = (!q || name.includes(q) || username.includes(q)) ? 'flex' : 'none';
                });
            };
            window.updateFriendSelectCount = function() {
                const count = state.tempSelectedFriends.length;
                const el = document.getElementById('friendSelectCount');
                if (el) el.textContent = `${count} friend${count !== 1 ? 's' : ''} selected`;
            };
            window.submitCreateSharedBL = function() {
                const name = document.getElementById('sblName').value.trim();
                if (!name) { showToast('Please enter a name'); return; }
                createSharedBucketList(name, document.getElementById('sblDesc').value.trim(), [...state
                    .tempSelectedFriends
                ], []);
            };
        }

        function openAddDestToSharedBLModal(sblId) {
            const sbl = state.sharedBucketLists.find(s => s.id === sblId);
            if (!sbl) return;
            const available = destinationsData.filter(d => !sbl.destinations.includes(d.id));
            openModal(`<h3>Add Destination</h3>
            <div class="friend-search-wrapper mb-3"><i class="bi bi-search"></i><input type="text" id="sblDestSearch" placeholder="Search destinations..." oninput="filterSBLDestinations(this.value)" autocomplete="off"></div>
            <div style="max-height:300px;overflow-y:auto;" id="sblDestList">
              ${available.map(d=>`<div class="card sbl-dest-option" data-dest-id="${d.id}" data-dest-name="${d.name.toLowerCase()}" data-dest-country="${d.country.toLowerCase()}" style="margin-bottom:6px;display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;" onclick="addDestToSharedBL('${sblId}','${d.id}');closeModal();"><img src="${d.image}" style="width:44px;height:44px;border-radius:var(--radius-sm);object-fit:cover;" loading="lazy"><div><div class="card-title">${d.name}</div><div class="card-subtitle">${d.country}</div></div></div>`).join('')}
              ${available.length===0?'<div style="text-align:center;padding:20px;color:var(--text-muted);">No more destinations to add.</div>':''}
            </div>
            <button class="btn btn-ghost btn-sm mt-2" style="width:100%;" onclick="closeModal()">Cancel</button>`);
            window.filterSBLDestinations = function(query) {
                const q = query.toLowerCase().trim();
                document.querySelectorAll('#sblDestList .sbl-dest-option').forEach(el => {
                    const name = el.dataset.destName || '';
                    const country = el.dataset.destCountry || '';
                    el.style.display = (!q || name.includes(q) || country.includes(q)) ? 'flex' : 'none';
                });
            };
        }

        function handleHomeSearch(value) {
            state.searchQuery = value;
            const dropdown = document.getElementById('homeSearchDropdown');
            if (dropdown) dropdown.innerHTML = renderSearchDropdown(value);
            const input = document.getElementById('homeSearchInput');
            if (input && input.value !== value) input.value = value;
        }

        function handleExploreSearch(value) {
            state.searchQuery = value;
            const dropdown = document.getElementById('exploreSearchDropdown');
            if (dropdown) dropdown.innerHTML = renderSearchDropdown(value);
            const input = document.getElementById('exploreSearchInput');
            if (input && input.value !== value) input.value = value;
        }

        function switchBLTab(index) {
            state.blSwipeTab = index;
            const container = document.getElementById('blSwipeContainer');
            if (container) container.scrollTo({ left: index * container.offsetWidth, behavior: 'smooth' });
            document.querySelectorAll('#blSwipeTabs .swipe-tab').forEach((t, i) => t.classList.toggle('active', i ===
                index));
            setTimeout(refreshAOS, 300);
        }

        function handleBLSwipeScroll() {
            const container = document.getElementById('blSwipeContainer');
            if (!container) return;
            const newTab = Math.round(container.scrollLeft / container.offsetWidth);
            if (newTab !== state.blSwipeTab) { state.blSwipeTab = newTab;
                document.querySelectorAll('#blSwipeTabs .swipe-tab').forEach((t, i) => t.classList.toggle('active', i ===
                    newTab)); }
        }

        function switchExploreTab(index) {
            state.exploreSwipeTab = index;
            const container = document.getElementById('exploreSwipeContainer');
            if (container) container.scrollTo({ left: index * container.offsetWidth, behavior: 'smooth' });
            document.querySelectorAll('#exploreSwipeTabs .swipe-tab').forEach((t, i) => t.classList.toggle('active', i ===
                index));
            setTimeout(refreshAOS, 300);
        }

        function handleExploreSwipeScroll() {
            const container = document.getElementById('exploreSwipeContainer');
            if (!container) return;
            const newTab = Math.round(container.scrollLeft / container.offsetWidth);
            if (newTab !== state.exploreSwipeTab) { state.exploreSwipeTab = newTab;
                document.querySelectorAll('#exploreSwipeTabs .swipe-tab').forEach((t, i) => t.classList.toggle('active',
                    i === newTab)); }
        }

        window.toggleBLCountry = function(countryKey) {
            const el = document.getElementById('bl-dests-' + countryKey);
            const parent = document.getElementById('bl-' + countryKey);
            const chevron = document.getElementById('bl-chevron-' + countryKey);
            if (el && parent) {
                const isExpanded = parent.classList.contains('expanded');
                if (isExpanded) { parent.classList.remove('expanded'); if (chevron) chevron.style.transform =
                        'rotate(0deg)'; } else { parent.classList.add('expanded'); if (chevron) chevron.style.transform =
                        'rotate(90deg)'; }
            }
        };

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-bar') && !e.target.closest('.friend-search-wrapper')) {
                document.querySelectorAll('.search-dropdown').forEach(el => el.classList.remove('visible'));
            }
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal();
                document.querySelectorAll('.search-dropdown').forEach(el => el.classList.remove('visible')); } });

        let aosObserver = null;

        function refreshAOS() {
            if (aosObserver) aosObserver.disconnect();
            if (state.settings.reducedMotion) {
                document.querySelectorAll('.aos-item').forEach(el => el.classList.add('aos-visible'));
                return;
            }
            aosObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('aos-visible');
                        aosObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' });
            document.querySelectorAll('.aos-item:not(.aos-visible)').forEach(el => {
                aosObserver.observe(el);
            });
        }

        function init() {
            applyTheme();
            renderPage();
            window.navigate = navigate;
            window.toggleBucketList = toggleBucketList;
            window.changeBucketStatus = changeBucketStatus;
            window.updateBucketEntryField = updateBucketEntryField;
            window.removeFromBucket = removeFromBucket;
            window.sendFriendRequest = sendFriendRequest;
            window.acceptFriend = acceptFriend;
            window.removeFriend = removeFriend;
            window.cancelFriendRequest = cancelFriendRequest;
            window.toggleLike = toggleLike;
            window.toggleSavePost = toggleSavePost;
            window.createPost = createPost;
            window.addDestinationToBucket = addDestinationToBucket;
            window.addCustomStatus = addCustomStatus;
            window.deleteCustomStatus = deleteCustomStatus;
            window.createSharedBucketList = createSharedBucketList;
            window.addMessageToSharedBL = addMessageToSharedBL;
            window.addDestToSharedBL = addDestToSharedBL;
            window.openAddDestinationModal = openAddDestinationModal;
            window.openEditBucketModal = openEditBucketModal;
            window.openManageStatusesModal = openManageStatusesModal;
            window.openCreateSharedBLModal = openCreateSharedBLModal;
            window.openAddDestToSharedBLModal = openAddDestToSharedBLModal;
            window.openCreatePostModal = openCreatePostModal;
            window.handleHomeSearch = handleHomeSearch;
            window.handleExploreSearch = handleExploreSearch;
            window.switchBLTab = switchBLTab;
            window.handleBLSwipeScroll = handleBLSwipeScroll;
            window.switchExploreTab = switchExploreTab;
            window.handleExploreSwipeScroll = handleExploreSwipeScroll;
            window.closeModal = closeModal;
            window.showToast = showToast;
            window.toggleTheme = toggleTheme;
            window.toggleFriendSelectionRow = null;
            window.filterFriendSelectionRows = null;
            window.updateFriendSelectCount = null;
            window.filterSBLDestinations = null;
            window.submitCreatePost = null;
            window.getDestination = getDestination;
            window.getUser = getUser;
            window.isInBucketList = isInBucketList;
            window.isFriend = isFriend;
            window.getFriendRequestStatus = getFriendRequestStatus;
            window.renderPage = renderPage;
            window.state = state;
            window.destinationsData = destinationsData;
            window.usersData = usersData;
            window.postsData = postsData;
            window.flagImgTag = flagImgTag;
            window.getFlagUrl = getFlagUrl;
            window.countryCodeMap = countryCodeMap;
            window.desireLabels = desireLabels;
            setTimeout(refreshAOS, 250);
            const mainContent = document.getElementById('mainContent');
            if (mainContent) {
                let scrollTimeout;
                mainContent.addEventListener('scroll', () => {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(refreshAOS, 200);
                }, { passive: true });
            }
        }
        init();
        console.log('Veyra — Travel Beyond. Fresh teal design, light mode default, fixed AOS, explore swipe, and searchable shared BL destinations.');
    </script>
</body>
</html>
